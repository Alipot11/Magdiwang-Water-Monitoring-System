<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/src/backend/search.js" defer></script>
    <title>Search Account</title>
</head>
<body>
    <div>
        <input type="text" id="search_input" placeholder="Search meter number...">
        <button id="search_button">Search</button>
    </div>
    <h3>Account</h3>
    <div id="account_table">
        <p>Meter No:</p>
        <p>Name:</p>
        <p></p>
        <p>Address:</p>
        <p></p>
        <p>Balance:</p>
        <br>
        <p>Payments</p>
        <p>Bills</p>
    </div>

    <button id="pay">Pay</button>

    <form action="" method="post" id="payment_form">
        <h3>Payment</h3>
        <div>
            <label for="bill_id">
                Bill No.: <select name="Bill id" id="bill_id">
                    <option value="">Select a bill</option>
                </select>
            </label>
            <br>
            <label for="meter_id">
                Meter No.: <input type="number" id="payment_meter_id" readonly>
            </label>
            <br>
            <label for="payment_date">
                Date: <input type="date" id="payment_date" required>
            </label>
            <br>
            <label for="amount_paid">
                Amount: <input type="number" id="amount_paid" step="0.01" min="0.01" required>
            </label>
            <br>
            <input type="submit" id="submit">
        </div>
    </form>
</body>
</html>
