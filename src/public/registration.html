<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style/registration.css">

    <script src="/js/registration.js" defer></script>

    <title>Register Client</title>
</head>

<body>

    <main class="registration-page">

        <header class="page-header">
            <div>
                <p class="page-label">Staff Portal</p>
                <h1>Register Client</h1>
                <p class="page-subtitle">
                    Add a new client account
                </p>
            </div>

            <a href="admin.html" class="back-button">
                ← Dashboard
            </a>
        </header>


        <form
            action=""
            method="post"
            id="registration_form"
            class="registration-form"
        >

            <h2>Client Information</h2>


            <div class="form-section">

                <h3>Account</h3>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="meter_id">
                            Meter Number
                        </label>

                        <input
                            type="number"
                            id="meter_id"
                            name="meter_id"
                            placeholder="Enter meter number"
                            required
                        >
                    </div>

                </div>

            </div>


            <div class="form-section">

                <h3>Personal Information</h3>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="first_name">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="first_name"
                            name="first_name"
                            placeholder="Enter first name"
                            autocomplete="given-name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="last_name">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="last_name"
                            name="last_name"
                            placeholder="Enter last name"
                            autocomplete="family-name"
                            required
                        >
                    </div>

                </div>

            </div>


            <div class="form-section">

                <h3>Address</h3>

                <div class="form-grid">

                    <div class="form-group">

                        <label for="barangay">
                            Barangay
                        </label>

                        <select
                            name="barangay"
                            id="barangay"
                            required
                        >
                            <option value="" selected disabled>
                                Select barangay
                            </option>

                            <option value="agutay">Agutay</option>
                            <option value="agsao">Agsao</option>
                            <option value="ipil">Ipil</option>
                            <option value="ambulong">Ambulong</option>
                            <option value="poblacion">Poblacion</option>
                            <option value="jao-asan">Jao-asan</option>
                            <option value="dulangan">Dulangan</option>
                            <option value="tampayan">Tampayan</option>
                            <option value="silum">Silum</option>
                        </select>

                    </div>


                    <div class="form-group">

                        <label for="sitio">
                            Sitio
                        </label>

                        <input
                            type="text"
                            id="sitio"
                            name="sitio"
                            placeholder="Enter sitio"
                            required
                        >

                    </div>

                </div>

            </div>


            <button
                type="submit"
                id="submit"
                class="submit-button"
            >
                Register Client
            </button>

        </form>

    </main>

</body>
</html>
