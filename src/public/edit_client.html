<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/edit_client.js" defer></script>
    <title>Edit Account</title>
</head>

<body>

    <h1>Edit Account</h1>

    <form id="edit_form">

        <div>
            <label for="meter_id">
                Meter No.:
            </label>
            <input
                type="number"
                id="meter_id"
                readonly
            >
        </div>

        <br>

        <div>
            <label for="first_name">
                First Name:
            </label>
            <input
                type="text"
                id="first_name"
                maxlength="255"
                required
            >
        </div>

        <br>

        <div>
            <label for="last_name">
                Last Name:
            </label>
            <input
                type="text"
                id="last_name"
                maxlength="255"
                required
            >
        </div>

        <br>

        <div>
            <label for="barangay">
                Barangay:
            </label>

            <select id="barangay" required>
                <option value="">Select Barangay</option>
                <option value="agutay">Agutay</option>
                <option value="agsao">Agsao</option>
                <option value="ipil">Ipil</option>
                <option value="ambulong">Ambulong</option>
                <option value="poblacion">Poblacion</option>
                <option value="jao-asan">Jao-asan</option>
                <option value="dulangan">Dulangan</option>
                <option value="tampayan">Tampayan</option>
                <option value="silum">Silum</option>
            </select>
        </div>

        <br>

        <div>
            <label for="sitio">
                Sitio:
            </label>
            <input
                type="text"
                id="sitio"
                maxlength="255"
                required
            >
        </div>

        <br>

        <button type="submit">
            Save Changes
        </button>

        <button
            type="button"
            id="cancel_button"
        >
            Cancel
        </button>

    </form>

</body>
</html>
