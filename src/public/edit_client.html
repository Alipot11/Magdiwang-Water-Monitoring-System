<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="/style/edit_client.css"
    >

    <script
        src="/js/edit_client.js"
        defer
    ></script>

    <title>Edit Account</title>
</head>

<body>

    <main class="edit-page">

        <!-- HEADER -->

        <header class="edit-header">

            <div>
                <p class="page-label">
                    Client Management
                </p>

                <h1>
                    Edit Account
                </h1>

                <p class="page-subtitle">
                    Update the client's account information.
                </p>
            </div>

            <a
                href="/search.html"
                class="back-button"
            >
                ← Back to Search
            </a>

        </header>


        <!-- FORM -->

        <section class="edit-card">

            <form id="edit_form">

                <div class="form-section">

                    <h2>
                        Account Information
                    </h2>

                    <div class="form-grid">

                        <!-- METER -->

                        <div class="form-group">

                            <label for="meter_id">
                                Meter No.
                            </label>

                            <input
                                type="number"
                                id="meter_id"
                                readonly
                            >

                        </div>


                        <!-- FIRST NAME -->

                        <div class="form-group">

                            <label for="first_name">
                                First Name
                            </label>

                            <input
                                type="text"
                                id="first_name"
                                maxlength="255"
                                required
                            >

                        </div>


                        <!-- LAST NAME -->

                        <div class="form-group">

                            <label for="last_name">
                                Last Name
                            </label>

                            <input
                                type="text"
                                id="last_name"
                                maxlength="255"
                                required
                            >

                        </div>


                        <!-- BARANGAY -->

                        <div class="form-group">

                            <label for="barangay">
                                Barangay
                            </label>

                            <select
                                id="barangay"
                                required
                            >

                                <option value="">
                                    Select Barangay
                                </option>

                                <option value="agutay">
                                    Agutay
                                </option>

                                <option value="agsao">
                                    Agsao
                                </option>

                                <option value="ipil">
                                    Ipil
                                </option>

                                <option value="ambulong">
                                    Ambulong
                                </option>

                                <option value="poblacion">
                                    Poblacion
                                </option>

                                <option value="jao-asan">
                                    Jao-asan
                                </option>

                                <option value="dulangan">
                                    Dulangan
                                </option>

                                <option value="tampayan">
                                    Tampayan
                                </option>

                                <option value="silum">
                                    Silum
                                </option>

                            </select>

                        </div>


                        <!-- SITIO -->

                        <div class="form-group">

                            <label for="sitio">
                                Sitio
                            </label>

                            <input
                                type="text"
                                id="sitio"
                                maxlength="255"
                                required
                            >

                        </div>

                    </div>

                </div>


                <!-- ACTIONS -->

                <div class="form-actions">

                    <button
                        type="submit"
                        class="save-button"
                    >
                        Save Changes
                    </button>

                    <button
                        type="button"
                        id="cancel_button"
                        class="cancel-button"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
