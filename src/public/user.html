<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/style/user.css">

    <script src="/js/user.js" defer></script>

    <title>My Water Account</title>

</head>

<body>

    <h1>Magdiwang Water Supply System</h1>

    <div class="container">

        <!-- SEARCH -->

        <section class="search-box">

            <h2>Account</h2>

            <p>
                Enter your meter number to view your account.
            </p>

            <form id="searchForm">

                <input
                    type="number"
                    id="meterId"
                    placeholder="Enter Meter ID"
                    required
                >

                <button type="submit">
                    Search
                </button>

            </form>

            <p id="message"></p>

        </section>


        <!-- CLIENT INFORMATION -->

        <section
            id="clientSection"
            class="card"
            style="display: none;"
        >

            <h2>Account Information</h2>

            <div class="client-info">

                <div>
                    <span>Meter ID:</span>
                    <strong id="clientMeter"></strong>
                </div>

                <div>
                    <span>Name:</span>
                    <strong id="clientName"></strong>
                </div>

                <div>
                    <span>Barangay:</span>
                    <strong id="clientBarangay"></strong>
                </div>

                <div>
                    <span>Sitio:</span>
                    <strong id="clientSitio"></strong>
                </div>

            </div>

        </section>


        <!-- BILLS -->

        <section
            id="billsSection"
            class="card"
            style="display: none;"
        >

            <h2>My Bills</h2>

            <div id="billsContainer"></div>

        </section>


        <!-- PAYMENT HISTORY -->

        <section
            id="historySection"
            class="card"
            style="display: none;"
        >

            <h2>Payment History</h2>

            <div id="historyContainer"></div>

        </section>

    </div>

</body>

</html>
